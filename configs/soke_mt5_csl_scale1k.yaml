# R026-a: Data scale experiment — 1000 training samples
# H4 hypothesis: data volume (18k) is insufficient for sign-text binding
# Compare BLEU4 at 1k vs 5k vs 10k vs 18k (R006) to get scaling curve.

NAME: SOKE_MT5_CSL_SCALE1K
USE_RAW_VIDEO: false
PRECISION: bf16-mixed
ACCELERATOR: 'gpu'
NUM_NODES: 1
DEVICE: [0,1,2,3,4,5,6,7]

TRAIN:
  STAGE: lm_pretrain
  NUM_WORKERS: 8
  BATCH_SIZE: 4
  END_EPOCH: 80
  RESUME: ''
  PRETRAINED: ''
  PRETRAINED_VAE: 'experiments/mgpt/VAE_SIGN_FINETUNE_LFQ4_ACC/checkpoints/last.ckpt'
  SUBSET_N: 1000   # ← cap training set to 1k samples (seed=42)

  OPTIM:
    target: AdamW
    params:
      lr: 1e-4
      betas: [0.9, 0.99]
      weight_decay: 0.0

  LR_SCHEDULER:
    target: CosineAnnealingLR
    params:
      T_max: ${TRAIN.END_EPOCH}
      eta_min: 1e-6

  CHECKPOINT:
    PERIODIC_EVERY_N_EPOCHS: 5
    SAVE_BEFORE_VAL: true
    SAVE_ON_TRAIN_END: true
    ENABLE_ROLLING_LAST: true

EVAL:
  BATCH_SIZE: 4
  SPLIT: val
  VAL_SUBSET_RATIO: 0.2
  LM_VAL_TASKS: ['m2t']

TEST:
  CHECKPOINTS: null
  SPLIT: test
  BATCH_SIZE: 4
  REPLICATION_TIMES: 1
  SAVE_PREDICTIONS: true

DATASET:
  target: mGPT.data.H2S.H2SDataModule
  H2S:
    DATASET_NAME: csl
    ROOT: data/CSL-Daily
    CSL_ROOT: data/CSL-Daily
    PHOENIX_ROOT: data/Phoenix_2014T
    MEAN_PATH: data/CSL-Daily/mean.pt
    STD_PATH: data/CSL-Daily/std.pt
    MAX_MOTION_LEN: 400
    MIN_MOTION_LEN: 40
    MAX_TEXT_LEN: 40
    PICK_ONE_TEXT: true
    FRAME_RATE: 20.0
    UNIT_LEN: 4
    STD_TEXT: false
    USE_RAW_MOTION: true
    DYNAMIC_TASK_SAMPLING: true
    TRAIN_TASKS: ['m2t']
    TASK_SAMPLING:
      t2m: 0.0
      m2t: 1.0
      mc: 0.0
  CODE_PATH: ''

METRIC:
  TYPE: ['M2TMetrics']

LOSS:
  LAMBDA_FEATURE: 1.0
  LAMBDA_VELOCITY: 0.0
  LAMBDA_COMMIT: 0.02
  LAMBDA_CLS: 1.0
  ABLATION:
    RECONS_LOSS: 'l1_smooth'

model:
  target: mGPT.models.mgpt.MotionGPT
  params:
    condition: 'text'
    task: 'm2t'
    lm: ${lm.mt5_base}
    motion_vae: ${vq.re128_lfq4}
    hand_vae_cfg: ${vq.hand256_lfq4}
    rhand_vae_cfg: ${vq.hand256_lfq4}

LOGGER:
  TYPE: ['wandb']
  VAL_EVERY_STEPS: 15
  WANDB:
    params:
      project: SLG
      offline: true
