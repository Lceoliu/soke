# Body VAE with ST-GCN encoder (43-dim input = 10 body joints × 3 + 13 face dims)
# Drop-in replacement for re128_lfq4.yaml — same quantizer/decoder, new encoder.
#
# Encoder: STGCNEncoder
#   - num_joints=10 (Neck, Collars, Head, Shoulders, Elbows, Wrists)
#   - feat_per_joint=3 (axis-angle)
#   - adj="body" (uses SMPL-X upper-body kinematic tree)
#   - extra_dims = 43 - 30 = 13 (jaw 3 + expression 10)
target: mGPT.archs.mgpt_vq.VQVae
params:
  quantizer: 'lfq'
  num_quantizers: 4
  code_num: 128
  code_dim: 512
  use_contact: true
  num_contact_classes: 3
  lfq_ste_temperature: 1.0
  lfq_ste_temperature_end: 0.1
  lfq_entropy_loss_weight: 0.1
  lfq_entropy_global_weight: 1.0
  lfq_entropy_local_weight: 1.0
  output_emb_width: 512
  down_t: 2
  stride_t: 2
  width: 512
  depth: 3
  dilation_growth_rate: 3
  norm: None
  activation: 'relu'
  nfeats: 43
  ablation: ${ABLATION}
  # ST-GCN encoder
  encoder_type: 'stgcn'
  num_joints: 10
  feat_per_joint: 3
  adj: 'body'
  n_gcn_layers: 2
  gcn_hidden: 128
  gcn_out: 256
  temporal_kernel_size: 9
