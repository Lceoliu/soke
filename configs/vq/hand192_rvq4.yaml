target: mGPT.archs.mgpt_vq.VQVae
params:
  quantizer: 'rvq_ema_reset'
  num_quantizers: 4
  # Legacy filename kept for compatibility; actual RVQ setting is hand code_num=256.
  code_num: 256
  code_dim: 512
  output_emb_width: 512
  down_t: 2
  stride_t: 2
  width: 512
  depth: 3
  dilation_growth_rate: 3
  norm: None
  activation: 'relu'
  nfeats: 45
  ablation: ${ABLATION}
