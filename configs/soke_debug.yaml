NAME: SOKE_QWEN_DEBUG # Experiment names (调试版本)
USE_RAW_VIDEO: false  
PRECISION: bf16-mixed
ACCELERATOR: 'gpu' 
NUM_NODES: 1
DEVICE: [0] # 单卡调试，先验证Qwen链路可运行

TRAIN:
  #---------------------------------
  STAGE: lm_pretrain 
  #---------------------------------
  NUM_WORKERS: 4 # 减少worker数量，降低DataLoader负载
  BATCH_SIZE: 1 # Qwen debug
  END_EPOCH: 150 
  RESUME: '' # 调试时默认从头启动
  PRETRAINED: '' 
  PRETRAINED_VAE: 'experiments/mgpt/VAE_SIGN_FINETUNE_LFQ4_ACC/checkpoints/last.ckpt'

  OPTIM:
    target: AdamW
    params:
      lr: 1e-4
      betas: [0.9, 0.99]
      weight_decay: 0.0
    PARAM_GROUPS:
      ENABLE_DIFF_LR: true
      BACKBONE_LR_MULT: 1.0
      EMBED_LR_MULT: 10.0
      LM_HEAD_LR_MULT: 10.0
      FAST_WARMUP:
        ENABLED: false
        START_FACTOR: 0.2
        BASE_WARMUP_EPOCHS: 0
        EMBED_LM_HEAD_WARMUP_EPOCHS: 2
  
  LR_SCHEDULER:
    target: CosineAnnealingLR
    params:
      T_max: ${TRAIN.END_EPOCH}
      eta_min: 1e-6

EVAL:
  BATCH_SIZE: 4 # 减小评估batch size
  SPLIT: val
  LM_VAL_TASKS: ['t2m', 'm2t', 'mc']

TEST:
  CHECKPOINTS: null
  SPLIT: test
  BATCH_SIZE: 4
  REPLICATION_TIMES: 1
  SAVE_PREDICTIONS: True

DATASET:
  target: mGPT.data.H2S.H2SDataModule
  H2S:
    DATASET_NAME: how2sign_csl_phoenix
    ROOT: data/How2Sign
    CSL_ROOT: data/CSL-Daily
    PHOENIX_ROOT: data/Phoenix_2014T
    MEAN_PATH: data/CSL-Daily/mean.pt
    STD_PATH: data/CSL-Daily/std.pt
    MAX_MOTION_LEN: 400
    MIN_MOTION_LEN: 40
    MAX_TEXT_LEN: 40
    PICK_ONE_TEXT: true
    FRAME_RATE: 20.0
    UNIT_LEN: 4
    STD_TEXT: False
    DYNAMIC_TASK_SAMPLING: true
    TRAIN_TASKS: ['t2m', 'm2t', 'mc']
    TASK_SAMPLING:
      t2m: 0.5
      m2t: 0.2
      mc: 0.3
  CODE_PATH: TOKENS_h2s_csl_phoenix

METRIC:
  TYPE: ['TM2TMetrics', 'M2TMetrics', 'MCMetrics']

LOSS:
  LAMBDA_FEATURE: 1.0
  LAMBDA_VELOCITY: 0.0
  LAMBDA_COMMIT: 0.02
  LAMBDA_CLS: 1.0
  ABLATION:
    RECONS_LOSS: 'l1_smooth'

model:
  target: mGPT.models.mgpt.MotionGPT
  params:
    condition: 'text'
    task: 't2m'
    lm: ${lm.qwen2_5_3b}
    motion_vae: ${vq.re128_lfq4}
    hand_vae_cfg: ${vq.hand256_lfq5}
    rhand_vae_cfg: ${vq.hand256_lfq5}

LOGGER:
  TYPE: ['wandb']
  VAL_EVERY_STEPS: 15
  WANDB:
    params:
      project: SLG_DEBUG
      offline: true
