NAME: VAE_SIGN_FINETUNE_LFQ4_ACC
ACCELERATOR: 'gpu'
PRECISION: '16-mixed'
NUM_NODES: 1
DEVICE: [0,1,2,3,4,5,6,7]

TRAIN:
  STAGE: vae
  NUM_WORKERS: 16
  # Per-GPU batch size. FK adds extra SMPL-X forward cost, so keep conservative.
  BATCH_SIZE: 16
  END_EPOCH: 120
  NUM_SANITY_VAL_STEPS: 0
  DDP_FIND_UNUSED_PARAMETERS: false
  RESUME: ''
  PRETRAINED: ''
  PRETRAINED_VAE: ''
  PRETRAINED_VAE_BODY: '/home/SOKE/experiments/mgpt/VAE_MOTIONX_PRETRAIN_LFQ4_C128H256/checkpoints/last.ckpt'
  PRETRAINED_VAE_LOAD_BODY: true
  PRETRAINED_VAE_LOAD_HAND: false
  PRETRAINED_VAE_LOAD_RHAND: false

  OPTIM:
    target: AdamW
    params:
      lr: 1e-4
      betas: [0.9, 0.99]
      weight_decay: 0.0

  LR_SCHEDULER:
    target: CosineAnnealingLR
    params:
      T_max: ${TRAIN.END_EPOCH}
      eta_min: 1e-6

EVAL:
  BATCH_SIZE: 4
  SPLIT: val
  NUM_WORKERS: 8

TEST:
  CHECKPOINTS: null
  SPLIT: test
  BATCH_SIZE: 4
  NUM_WORKERS: 8
  REPLICATION_TIMES: 1
  SAVE_PREDICTIONS: False

DATASET:
  target: mGPT.data.H2S.H2SDataModule
  H2S:
    DATASET_NAME: how2sign_csl_phoenix
    ROOT: data/How2Sign
    CSL_ROOT: data/CSL-Daily
    PHOENIX_ROOT: data/Phoenix_2014T
    MEAN_PATH: data/CSL-Daily/mean.pt
    STD_PATH: data/CSL-Daily/std.pt
    MAX_MOTION_LEN: 400
    MIN_MOTION_LEN: 40
    MAX_TEXT_LEN: 20
    PICK_ONE_TEXT: true
    FRAME_RATE: 20.0
    UNIT_LEN: 4
    STD_TEXT: False

METRIC:
  TYPE: ['MRMetrics']

LOSS:
  LAMBDA_FEATURE: 1.0
  LAMBDA_VELOCITY: 0.3
  LAMBDA_FK_HAND: 0.5
  # Hand joint acceleration in wrist-relative FK space (2nd-order temporal diff).
  LAMBDA_ACCEL_HAND: 0.1
  # Two-hand relation acceleration on global wrist relative vector (right-left).
  LAMBDA_ACCEL_WRIST_REL: 0.1
  VELOCITY_PART_WEIGHTS:
    UPPER: 1.0
    HAND: 0.0
    FACE: 0.5
  LAMBDA_COMMIT: 0.02
  LAMBDA_CLS: 1.0
  PART_WEIGHTS:
    UPPER: 2.0
    HAND: 2.0
    FACE: 1.2
  ABLATION:
    RECONS_LOSS: 'l1_smooth'

model:
  target: mGPT.models.mgpt.MotionGPT
  params:
    condition: 'text'
    task: 't2m'
    lm: ${lm.default}
    motion_vae: ${vq.re128_lfq4}
    hand_vae_cfg: ${vq.hand256_lfq4}
    rhand_vae_cfg: ${vq.hand256_lfq4}

LOGGER:
  TYPE: ['wandb']
  VAL_EVERY_STEPS: 10
  WANDB:
    params:
      project: SLG_VAE_FINETUNE
      offline: true
