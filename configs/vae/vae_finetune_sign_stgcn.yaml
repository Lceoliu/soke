# F3-B: Re-train body + hand VAEs with ST-GCN encoder on sign data.
# Mirrors vae_finetune_sign_lfq4.yaml but swaps encoder_type to 'stgcn'.
#
# Run: python train.py --cfg configs/vae/vae_finetune_sign_stgcn.yaml
# Checkpoint: experiments/mgpt/VAE_SIGN_FINETUNE_STGCN/checkpoints/last.ckpt
#
# After this runs, use configs/soke_mt5_csl_stgcn.yaml for F3-C (M2 re-run).
NAME: VAE_SIGN_FINETUNE_STGCN
ACCELERATOR: 'gpu'
PRECISION: '16-mixed'
NUM_NODES: 1
DEVICE: [0,1,2,3]

TRAIN:
  STAGE: vae
  NUM_WORKERS: 16
  BATCH_SIZE: 32
  END_EPOCH: 120
  RESUME: ''
  PRETRAINED: ''
  # Start from existing Conv1d checkpoint (encoder weights won't load — fine;
  # decoder + quantizer weights will initialize the new model).
  # Set to '' to train from scratch.
  PRETRAINED_VAE: 'experiments/mgpt/VAE_SIGN_FINETUNE_LFQ4_ACC/checkpoints/last.ckpt'
  DDP_FIND_UNUSED_PARAMETERS: true

  OPTIM:
    target: AdamW
    params:
      lr: 1e-4
      betas: [0.9, 0.99]
      weight_decay: 1e-4   # slight weight decay to regularize GCN weights

  LR_SCHEDULER:
    target: CosineAnnealingLR
    params:
      T_max: ${TRAIN.END_EPOCH}
      eta_min: 1e-6

EVAL:
  BATCH_SIZE: 16
  SPLIT: val
  NUM_WORKERS: 8

TEST:
  CHECKPOINTS: null
  SPLIT: test
  BATCH_SIZE: 16
  NUM_WORKERS: 8
  REPLICATION_TIMES: 1
  SAVE_PREDICTIONS: False

DATASET:
  target: mGPT.data.H2S.H2SDataModule
  H2S:
    DATASET_NAME: how2sign_csl_phoenix
    ROOT: data/How2Sign
    CSL_ROOT: data/CSL-Daily
    PHOENIX_ROOT: data/Phoenix_2014T
    MEAN_PATH: data/CSL-Daily/mean.pt
    STD_PATH: data/CSL-Daily/std.pt
    MAX_MOTION_LEN: 400
    MIN_MOTION_LEN: 40
    MAX_TEXT_LEN: 20
    PICK_ONE_TEXT: true
    FRAME_RATE: 20.0
    UNIT_LEN: 4
    STD_TEXT: False

METRIC:
  TYPE: ['MRMetrics']

LOSS:
  LAMBDA_FEATURE: 1.0
  LAMBDA_VELOCITY: 0.3
  VELOCITY_PART_WEIGHTS:
    UPPER: 1.0
    HAND: 0.0
    FACE: 0.5
  LAMBDA_COMMIT: 0.02
  LAMBDA_CLS: 1.0
  PART_WEIGHTS:
    UPPER: 2.0
    HAND: 1.0
    FACE: 1.2
  ABLATION:
    RECONS_LOSS: 'l1_smooth'

model:
  target: mGPT.models.mgpt.MotionGPT
  params:
    condition: 'text'
    task: 't2m'
    lm: ${lm.default}
    motion_vae: ${vq.re128_stgcn}
    hand_vae_cfg: ${vq.hand256_stgcn}
    rhand_vae_cfg: ${vq.hand256_stgcn}

LOGGER:
  TYPE: ['wandb']
  VAL_EVERY_STEPS: 10
  WANDB:
    params:
      project: SLG_VAE_STGCN
      offline: true
