NAME: SOKE_QWEN_new # Experiment names
USE_RAW_VIDEO: false  # 可视化时是否读取原始 RGB 视频（vis_mesh 使用）
PRECISION: bf16-mixed
ACCELERATOR: 'gpu' # Devices optioncal: “cpu”, “gpu”, “tpu”, “ipu”, “hpu”, “mps, “auto”
NUM_NODES: 1 # Number of GPU nodes for distributed training
DEVICE: [0,1,2,3,4,5,6,7] # Index of gpus eg. [0] or [0,1,2,3] (from CUDA_VISIBLE_DEVICES: 0,1,2,3,4,5,6,7)

TRAIN:
  #---------------------------------
  STAGE: lm_pretrain # stage "vae" , "lm_pretrain", "lm_instruct"
  #---------------------------------
  NUM_WORKERS: 16 # Number of workers
  BATCH_SIZE: 4 # Size of batches
  END_EPOCH: 160 # End epoch
  RESUME: '' # Resume training from this path (empty for starting fresh)
  PRETRAINED: '' # Preatrained model path
  PRETRAINED_VAE: 'experiments/mgpt/VAE_SIGN_FINETUNE_LFQ4_ACC/checkpoints/last.ckpt' # Vae model path

  OPTIM:
    target: AdamW
    params:
      lr: 1e-4
      betas: [0.9, 0.99]
      weight_decay: 0.0
    PARAM_GROUPS:
      ENABLE_DIFF_LR: true
      BACKBONE_LR_MULT: 1.0
      EMBED_LR_MULT: 10.0
      LM_HEAD_LR_MULT: 10.0
      FAST_WARMUP:
        ENABLED: false
        START_FACTOR: 0.2
        BASE_WARMUP_EPOCHS: 0
        EMBED_LM_HEAD_WARMUP_EPOCHS: 2
  
  LR_SCHEDULER:
    target: CosineAnnealingLR
    params:
      T_max: ${TRAIN.END_EPOCH}  #${eval:${LOGGER.VAL_EVERY_STEPS} * 100}
      eta_min: 1e-6

# Evaluating Configuration
EVAL:
  BATCH_SIZE: 8 # Evaluating Batch size
  SPLIT: val
  VAL_SUBSET_RATIO: 0.2
  LM_VAL_TASKS: ['t2m', 'm2t', 'mc']

TEST:
  CHECKPOINTS: null
  SPLIT: test
  BATCH_SIZE: 8 # training Batch size
  REPLICATION_TIMES: 1 # Number of times to replicate the test
  SAVE_PREDICTIONS: True

DATASET:
  target: mGPT.data.H2S.H2SDataModule
  H2S:
    DATASET_NAME: how2sign_csl_phoenix
    ROOT: data/How2Sign
    CSL_ROOT: data/CSL-Daily
    PHOENIX_ROOT: data/Phoenix_2014T
    MEAN_PATH: data/CSL-Daily/mean.pt
    STD_PATH: data/CSL-Daily/std.pt
    MAX_MOTION_LEN: 400
    MIN_MOTION_LEN: 40
    MAX_TEXT_LEN: 40
    PICK_ONE_TEXT: true
    FRAME_RATE: 20.0
    UNIT_LEN: 4
    STD_TEXT: False
    DYNAMIC_TASK_SAMPLING: true
    TRAIN_TASKS: ['t2m', 'm2t', 'mc']
    TASK_SAMPLING:
      t2m: 0.5
      m2t: 0.2
      mc: 0.3
  CODE_PATH: TOKENS_h2s_csl_phoenix

METRIC:
  TYPE: ['TM2TMetrics', 'M2TMetrics', 'MCMetrics']

LOSS:
  LAMBDA_FEATURE: 1.0
  LAMBDA_VELOCITY: 0.0
  LAMBDA_COMMIT: 0.02
  LAMBDA_CLS: 1.0
  ABLATION:
    RECONS_LOSS: 'l1_smooth'

model:
  target: mGPT.models.mgpt.MotionGPT
  params:
    condition: 'text'
    task: 't2m'
    lm: ${lm.qwen2_5_3b}
    motion_vae: ${vq.re128_lfq4}
    hand_vae_cfg: ${vq.hand256_lfq5}
    rhand_vae_cfg: ${vq.hand256_lfq5}

LOGGER:
  TYPE: ['wandb']
  VAL_EVERY_STEPS: 15
  WANDB:
    params:
      project: SLG
      offline: true  # 设置为离线模式，避免连接超时
