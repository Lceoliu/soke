target: mGPT.archs.mgpt_qwen.QwenCausalLM
params:
  model_type: qwen2_causal
  model_path: ./deps/Qwen2.5-3B
  stage: ${TRAIN.STAGE}
  motion_codebook_size: ${model.params.motion_vae.params.code_num}
  hand_codebook_size: 0
  rhand_codebook_size: 0
  max_length: 2048
  generation_max_new_tokens: 1024
  trust_remote_code: true
  use_lora: true
  lora_rank: 64
  lora_alpha: 128
  lora_dropout: 0.05
  gradient_checkpointing: true
  torch_dtype: bfloat16
  m2t_prefix_loss_weight: 0.0
